<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Document | Superwings Foundation</title>
<link rel="icon" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  @page{size:A4;margin:0}
  body{background:#e7ece5;animation:none}
  .tools{width:210mm;max-width:96vw;margin:22px auto 0;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .tools .btn{padding:.6rem 1.1rem;font-size:.92rem}
  .sheet{width:210mm;min-height:297mm;margin:14px auto 40px;background:#fff;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.14);overflow:hidden;display:flex;flex-direction:column;font-size:11pt;line-height:1.55;color:#1c2a22}
  .lh-top{height:7mm;background:linear-gradient(90deg,var(--green) 0 74%,var(--yellow) 74% 100%)}
  .lh-head{display:flex;align-items:center;justify-content:space-between;gap:8mm;padding:7mm 16mm 5mm;border-bottom:1.2px solid #d9e3dc}
  .lh-head img{height:24mm;width:auto}
  .lh-org{text-align:right;font-size:8.4pt;line-height:1.5;color:#4a5a50}
  .lh-org strong{display:block;font-family:"Baloo 2";font-size:17pt;line-height:1.1;color:var(--green-deep);letter-spacing:.01em}
  .lh-org .tag{font-size:8pt;text-transform:uppercase;letter-spacing:.16em;color:var(--green);font-weight:700}
  .mark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .mark img{width:120mm;opacity:.045}
  .content{flex:1;padding:9mm 18mm 6mm;position:relative}
  .lh-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8mm;padding:4mm 16mm 6mm;border-top:1.2px solid #d9e3dc;font-size:8pt;color:#4a5a50;position:relative}
  .lh-foot .ids b{color:var(--green-deep)}
  .lh-foot .qr{display:flex;gap:4mm;align-items:center;text-align:right}
  .lh-foot .qr img{width:22mm;height:22mm}
  .lh-bottom{height:3mm;background:var(--green-deep)}
  .meta{display:flex;justify-content:space-between;gap:10mm;font-size:10pt;margin-bottom:7mm}
  .meta b{color:var(--green-deep)}
  h1.doc-title{font-family:"Baloo 2";font-size:20pt;color:var(--green-deep);margin:0 0 3mm;line-height:1.15}
  .lead{color:#4a5a50;margin-bottom:5mm}
  .box{background:#f5f9f3;border:1px solid #dfe8e1;border-radius:3mm;padding:4mm 5mm;margin:4mm 0 5mm;display:grid;grid-template-columns:1.5fr 1fr;gap:5mm;align-items:center}
  .kv{display:grid;grid-template-columns:34mm 1fr;gap:1.2mm 4mm;font-size:10pt}
  .kv dt{color:#5b6b61}
  .kv dd{font-weight:700}
  .big{text-align:center}
  .big b{display:block;font-family:"Baloo 2";font-size:30pt;color:var(--green-deep);line-height:1}
  table.d{width:100%;border-collapse:collapse;font-size:9.2pt;margin-top:2mm}
  table.d th{text-align:left;font-size:7.6pt;text-transform:uppercase;letter-spacing:.08em;color:#5b6b61;border-bottom:1.5px solid #cfdcd3;padding:2mm 2mm}
  table.d td{border-bottom:1px solid #e3ebe5;padding:2mm;vertical-align:top}
  .body p{margin:0 0 3.5mm;text-align:justify}
  .sign{margin-top:12mm;display:flex;justify-content:space-between;align-items:flex-end;gap:10mm}
  .sign .who{min-width:62mm}
  .sign .line{border-top:1.2px solid #1c2a22;padding-top:2mm}
  .sign .who strong{display:block;font-size:10.5pt}
  .e-note{font-size:7.8pt;color:#6b7b71;max-width:80mm}
  .seal{width:26mm;height:26mm;border-radius:50%;border:2px solid var(--green);display:grid;place-items:center;text-align:center;font-size:6.4pt;font-weight:800;color:var(--green);letter-spacing:.06em;text-transform:uppercase;transform:rotate(-10deg);opacity:.85;line-height:1.2;padding:2mm}
  /* certificate */
  .cert{border:2.2mm double var(--green);outline:1px solid var(--yellow);outline-offset:-4.5mm;border-radius:2mm;padding:12mm 12mm 9mm;text-align:center;min-height:178mm;display:flex;flex-direction:column;justify-content:center}
  .cert .kicker{font-size:9pt;letter-spacing:.3em;text-transform:uppercase;color:var(--green);font-weight:800}
  .cert h1{font-family:"Baloo 2";font-size:28pt;color:var(--green-deep);margin:3mm 0 1mm;line-height:1.1}
  .cert .sub{color:#5b6b61;font-size:10.5pt}
  .cert .to{margin:9mm 0 2mm;font-size:10.5pt;color:#4a5a50}
  .cert .name{font-family:"Great Vibes","Baloo 2",cursive;font-size:36pt;color:var(--green-deep);line-height:1.15;border-bottom:1px solid #cfdcd3;display:inline-block;padding:0 10mm 1mm;margin-bottom:5mm}
  .cert .text{max-width:140mm;margin:0 auto;font-size:11pt}
  .cert .sign{display:grid;grid-template-columns:1fr auto 1fr;gap:8mm;align-items:end;margin-top:14mm}
  .cert .sign .who{min-width:0}
  /* revoked */
  .void{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
  .void span{border:4px solid #b42318;color:#b42318;font-family:"Baloo 2";font-weight:800;font-size:54pt;padding:2mm 10mm;transform:rotate(-24deg);opacity:.55;letter-spacing:.1em}
  .void-note{background:#fdecea;color:#b42318;font-weight:700;padding:3mm 5mm;border-radius:2mm;margin-bottom:5mm;font-size:10pt}
  .loading{padding:40mm 20mm;text-align:center;color:#5b6b61}
  @media print{body{background:#fff}.tools,.site-header,.site-footer{display:none!important}.sheet{margin:0;box-shadow:none;width:210mm;min-height:297mm}}
  @media (max-width:820px){.sheet{zoom:.46}}
</style>
</head>
<body>
<div class="tools" id="tools"><a class="btn btn-ghost" href="/verify">Verify a document</a></div>
<div class="sheet" id="sheet"><div class="loading">Loading document…</div></div>
<script src="/assets/config.js"></script>
<script src="/assets/site.js"></script>
<script>
(async () => {
  const { esc } = SW;
  const q = new URLSearchParams(location.search), ref = q.get('ref') || '', code = q.get('code') || '';
  const sheet = document.getElementById('sheet');
  const D = (iso, o = { day: 'numeric', month: 'long', year: 'numeric' }) => (iso ? SW.fmt(String(iso).length === 10 ? iso + 'T12:00:00+05:30' : iso, o) : '');
  const inr = (n) => '₹' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function words(num) { // Indian numbering system
    const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    const two = (n) => (n < 20 ? a[n] : b[Math.floor(n / 10)] + (n % 10 ? ' ' + a[n % 10] : ''));
    const three = (n) => (n >= 100 ? a[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + two(n % 100) : '') : two(n));
    let n = Math.floor(num), out = [];
    const units = [[1e7, 'Crore'], [1e5, 'Lakh'], [1e3, 'Thousand']];
    for (const [v, w] of units) if (n >= v) { out.push(three(Math.floor(n / v)) + ' ' + w); n %= v; }
    if (n) out.push(three(n));
    const paise = Math.round((num - Math.floor(num)) * 100);
    return 'Rupees ' + (out.join(' ') || 'Zero') + (paise ? ' and ' + two(paise) + ' Paise' : '') + ' Only';
  }
  const paras = (t) => esc(t || '').split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
  const qr = (url) => `https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=0&color=0f4d28&data=${encodeURIComponent(url)}`;

  if (!ref || !code) { sheet.innerHTML = '<div class="loading">This link is incomplete. Use the full link from the email, or <a href="/verify">verify a document</a>.</div>'; return; }
  let res;
  try { res = await SW.api(`/api/verify?ref=${encodeURIComponent(ref)}&code=${encodeURIComponent(code)}`); }
  catch (e) { sheet.innerHTML = `<div class="loading">${esc(e.message)}<br><br><a class="btn btn-ghost" href="/verify">Verify a document</a></div>`; return; }
  const doc = res.document, s = res.settings, data = doc.data || {};
  document.title = `${doc.title} · ${doc.ref_no} | ${s.org_name}`;

  const sign = (left = '') => `<div class="sign">${left || `<div class="e-note">This document was issued electronically by ${esc(s.org_name)} and does not need a physical signature. Its authenticity can be checked online using the reference number and code below.</div>`}
    <div class="who"><div style="height:12mm"></div><div class="line"><strong>${esc(doc.signatory || 'Board of Trustees')}</strong>${esc(doc.signatory_title || '')}<br>For ${esc(s.org_name)}</div></div></div>`;

  let inner = '';
  if (doc.type === 'letter') {
    inner = `<div class="meta"><div><b>Ref:</b> ${esc(doc.ref_no)}</div><div><b>Date:</b> ${esc(D(doc.issued_at))}</div></div>
      <div style="margin-bottom:6mm">To,<br><strong>${esc(doc.recipient_name)}</strong>${data.recipient_line ? '<br>' + esc(data.recipient_line).replace(/\n/g, '<br>') : ''}</div>
      ${data.subject ? `<p style="margin-bottom:5mm"><b>Subject:</b> ${esc(data.subject)}</p>` : ''}
      <h1 class="doc-title" style="font-size:15pt">${esc(doc.title)}</h1>
      <div class="body">${paras(doc.body)}</div>${sign()}`;
  } else if (doc.type === 'certificate') {
    inner = `<div class="cert"><div class="kicker">${esc(s.org_name)}</div><h1>${esc(doc.title)}</h1>${data.subtitle ? `<div class="sub">${esc(data.subtitle)}</div>` : ''}
      <div class="to">This is proudly presented to</div><div><span class="name">${esc(doc.recipient_name)}</span></div>
      <div class="text body">${paras(doc.body)}</div>
      <div class="sign"><div class="who"><div class="line"><strong>${esc(D(doc.issued_at))}</strong>Date of issue</div></div><div class="seal">${esc(s.org_name)}<br>Verified<br>online</div>
      <div class="who"><div style="height:10mm"></div><div class="line"><strong>${esc(doc.signatory || 'Board of Trustees')}</strong>${esc(doc.signatory_title || '')}</div></div></div></div>`;
  } else if (doc.type === 'hours_statement') {
    const cas = data.programme === 'ibdp_cas', st = { creativity: 'C', activity: 'A', service: 'S' };
    inner = `<div class="meta"><div><b>Ref:</b> ${esc(doc.ref_no)}</div><div><b>Date:</b> ${esc(D(doc.issued_at))}</div></div>
      <h1 class="doc-title">Volunteer Hours Statement</h1>
      <p class="lead">This is to certify that the volunteer named below completed the following service with ${esc(s.org_name)}. Each entry was verified by our programme coordinators.</p>
      <div class="box"><dl class="kv"><dt>Volunteer</dt><dd>${esc(doc.recipient_name)}</dd><dt>Programme</dt><dd>${esc(data.programme_label || '')}</dd>
        <dt>Institution</dt><dd>${esc(data.institution || '—')}${data.grade ? ', ' + esc(data.grade) : ''}</dd><dt>Period</dt><dd>${esc(D(data.period_from, { dateStyle: 'medium' }))} – ${esc(D(data.period_to, { dateStyle: 'medium' }))}</dd></dl>
        <div class="big"><b>${esc(data.total_hours)}</b>verified hours</div></div>
      <table class="d"><thead><tr><th>Date</th><th>Activity</th>${cas ? '<th>Strands</th><th>Outcomes</th>' : ''}<th style="text-align:right">Hours</th></tr></thead><tbody>
        ${(data.activities || []).map((a) => `<tr><td style="white-space:nowrap">${esc(D(a.date, { dateStyle: 'medium' }))}</td><td>${esc(a.title)}</td>
          ${cas ? `<td>${esc((a.strands || '').split(',').filter(Boolean).map((x) => st[x]).join(', '))}</td><td>${esc((a.outcomes || '').replace(/,/g, ', '))}</td>` : ''}<td style="text-align:right">${esc(a.hours)}</td></tr>`).join('')}
      </tbody></table>${cas ? '<p style="font-size:7.8pt;color:#6b7b71;margin-top:2mm">C = Creativity · A = Activity · S = Service. Learning outcomes (LO1–LO7) as tagged by the student and verified by our coordinators.</p>' : ''}
      ${sign()}`;
  } else if (doc.type === 'donation_receipt') {
    inner = `<div class="meta"><div><b>Receipt no.:</b> ${esc(doc.ref_no)}</div><div><b>Date:</b> ${esc(D(data.received_at || doc.issued_at))}</div></div>
      <h1 class="doc-title">Donation Receipt</h1>
      <p class="lead">Received with thanks from the donor named below, towards the charitable objects of the trust.</p>
      <div class="box" style="grid-template-columns:1fr"><dl class="kv" style="grid-template-columns:44mm 1fr">
        <dt>Received from</dt><dd>${esc(doc.recipient_name)}</dd>${data.address ? `<dt>Address</dt><dd>${esc(data.address)}</dd>` : ''}${data.pan ? `<dt>Donor PAN</dt><dd>${esc(data.pan)}</dd>` : ''}
        <dt>Amount</dt><dd>${inr(data.amount)}</dd><dt>Amount in words</dt><dd>${esc(words(Number(data.amount)))}</dd>
        <dt>Mode of payment</dt><dd>${esc(data.mode || '')}</dd>${data.txn_ref ? `<dt>Transaction ref.</dt><dd>${esc(data.txn_ref)}</dd>` : ''}${data.purpose ? `<dt>Towards</dt><dd>${esc(data.purpose)}</dd>` : ''}
      </dl></div>
      <dl class="kv" style="grid-template-columns:44mm 1fr;font-size:9.4pt"><dt>Trust PAN</dt><dd>${esc(s.pan)}</dd>${s.reg_12a ? `<dt>12A registration</dt><dd>${esc(s.reg_12a)}</dd>` : ''}${s.reg_80g ? `<dt>80G registration</dt><dd>${esc(s.reg_80g)}${s.reg_80g_validity ? ' (valid ' + esc(s.reg_80g_validity) + ')' : ''}</dd>` : ''}</dl>
      ${s.reg_80g ? `<p style="font-size:9pt;margin-top:4mm">Donations to ${esc(s.org_name)} are eligible for deduction under Section 80G of the Income Tax Act, subject to the conditions of the Act.</p>` : ''}
      ${sign()}`;
  }

  const verifyUrl = doc.verify_url || `${location.origin}/verify?ref=${encodeURIComponent(doc.ref_no)}&code=${doc.code}`;
  const host = (s.site_url || location.origin).replace(/^https?:\/\//, '').replace(/\/$/, '');
  sheet.innerHTML = `<div class="lh-top"></div>
    <div class="lh-head"><img src="/assets/logo.jpg" alt="${esc(s.org_name)}"><div class="lh-org"><span class="tag">Public Charitable Trust</span><strong>${esc(s.org_name)}</strong>
      Reg. No. ${esc(s.reg_no)} · NGO Darpan ${esc(s.darpan_id)} · PAN ${esc(s.pan)}${s.reg_12a ? ' · 12A ' + esc(s.reg_12a) : ''}${s.reg_80g ? ' · 80G ' + esc(s.reg_80g) : ''}<br>
      ${esc(s.address)}<br>${esc(s.contact_email)} · ${esc(s.contact_phone)} · ${esc(host)}</div></div>
    <div class="mark"><img src="/assets/logo.jpg" alt=""></div>
    ${doc.status === 'revoked' ? '<div class="void"><span>REVOKED</span></div>' : ''}
    <div class="content">${doc.status === 'revoked' ? `<div class="void-note">This document has been revoked by the issuer and is no longer valid.${doc.revoked_reason ? ' Reason: ' + esc(doc.revoked_reason) : ''}</div>` : ''}${inner}</div>
    <div class="lh-foot"><div class="ids"><b>Ref. no.</b> ${esc(doc.ref_no)} &nbsp;·&nbsp; <b>Issued</b> ${esc(D(doc.issued_at))} &nbsp;·&nbsp; <b>Verification code</b> ${esc(doc.code)}<br>
      To check that this document is genuine, scan the QR code or visit <b>${esc(host)}/verify</b> and enter the reference number and code.</div>
      <div class="qr"><img src="${qr(verifyUrl)}" alt="QR code to verify this document" onerror="this.style.display='none'"></div></div>
    <div class="lh-bottom"></div>`;
  document.getElementById('tools').innerHTML = `<a class="btn btn-ghost" href="${esc(verifyUrl.replace(/^https?:\/\/[^/]+/, ''))}">Verification page</a><button class="btn btn-primary" onclick="print()">Print / Save as PDF</button>`;
})();
</script>
</body>
</html>
