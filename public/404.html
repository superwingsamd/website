<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superwings Foundation</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .ev-hero{position:relative;min-height:420px;display:flex;align-items:flex-end;background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;overflow:hidden}
  .ev-hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ev-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,77,40,.15) 0%,rgba(10,40,22,.85) 100%)}
  .ev-hero .wrap{position:relative;z-index:1;padding:120px 0 48px}
  .ev-hero h1{color:#fff;font-size:clamp(2.3rem,5vw,3.8rem);font-weight:800;max-width:900px}
  .ev-hero p.sub{font-size:1.2rem;opacity:.92;margin-top:.6rem;max-width:760px}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .chip{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.5rem 1rem;font-weight:700;font-size:.92rem}
  .chip.y{background:var(--yellow);color:var(--green-deep);border-color:var(--yellow)}
  .layout{display:grid;grid-template-columns:1.35fr .9fr;gap:44px;align-items:start}
  .desc p{margin-bottom:1rem;color:#33443a}
  .desc a{color:var(--green)}
  .agenda{position:relative;margin-top:10px}
  .ag{display:grid;grid-template-columns:120px 1fr;gap:22px;position:relative;padding-bottom:26px}
  .ag::before{content:"";position:absolute;left:131px;top:10px;bottom:-4px;width:2px;background:var(--line)}
  .ag:last-child::before{display:none}
  .ag .t{font-family:"Baloo 2";font-weight:800;color:var(--green-deep);font-size:1.1rem;text-align:right;line-height:1.3}
  .ag .t small{display:block;font-family:"Nunito Sans";font-weight:600;color:var(--muted);font-size:.8rem}
  .ag .b{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-left:12px}
  .ag .b::before{content:"";position:absolute;left:-19px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--yellow);border:3px solid var(--green)}
  .ag h4{font-size:1.15rem}
  .ag .sp{font-size:.88rem;color:var(--green);font-weight:700}
  .ag p{font-size:.93rem;color:var(--muted);margin-top:.3rem}
  .reg-card{position:sticky;top:96px}
  .reg-card h3{font-size:1.6rem;margin-bottom:.3rem}
  .seats{display:inline-block;background:var(--yellow-soft);color:var(--green-deep);font-weight:800;font-size:.85rem;border-radius:999px;padding:.3rem .8rem;margin-bottom:16px}
  .info{display:grid;gap:12px;margin:20px 0 6px;font-size:.95rem}
  .info div{display:flex;gap:12px}
  .info b{flex:none;width:32px;height:32px;border-radius:10px;background:var(--yellow-soft);display:grid;place-items:center;color:var(--green-dark)}
  .code{font-family:ui-monospace,monospace;font-size:1.6rem;letter-spacing:4px;color:var(--green);font-weight:800;background:var(--yellow-soft);border-radius:12px;padding:10px 16px;display:inline-block;margin:10px 0}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .actions .btn{padding:.65rem 1.1rem;font-size:.92rem}
  @media (max-width:960px){.layout{grid-template-columns:1fr}.reg-card{position:static}}
  @media (max-width:620px){.ag{grid-template-columns:78px 1fr;gap:14px}.ag::before{left:89px}.ag .t{font-size:.95rem}}
</style>
</head>
<body>
<main id="main">
  <div class="ev-hero"><div class="wrap"><h1>Loading…</h1></div></div>
</main>
<script src="/assets/config.js"></script>
<script src="/assets/site.js"></script>
<script>
  SW.chrome('Events');
  const m = location.pathname.match(/^\/events\/([^/]+)\/?$/);
  const slug = m ? decodeURIComponent(m[1]) : new URLSearchParams(location.search).get('e');
  const { esc } = SW;
  const main = document.getElementById('main');
  let painted = false, dirty = false, registered = false;

  function ics(ev) {
    const f = (iso) => new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Superwings Foundation//Events//EN', 'BEGIN:VEVENT',
      `UID:${ev.slug}@superwingsfoundation.org`, `DTSTAMP:${f(new Date().toISOString())}`, `DTSTART:${f(ev.start_at)}`, `DTEND:${f(ev.end_at)}`,
      `SUMMARY:${ev.title}`, `LOCATION:${[ev.venue, ev.address].filter(Boolean).join(', ')}`, `URL:${location.href}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([body], { type: 'text/calendar' })), download: `${ev.slug}.ics` }).click();
  }
  function regForm(ev) {
    if (ev.ended) return `<h3>This event has ended</h3><p class="muted">Thank you to everyone who joined us. See <a href="/events/">upcoming events</a>.</p>`;
    if (ev.full) return `<h3>Registrations are full</h3><p class="muted">This event has reached capacity. Write to us if you would like to be added to a waitlist.</p>`;
    if (!ev.can_register) return `<h3>Registration closed</h3><p class="muted">Registration is not open for this event.</p>`;
    return `<h3>Register</h3>${ev.seats_left != null ? `<span class="seats">${ev.seats_left} seat${ev.seats_left === 1 ? '' : 's'} left</span>` : ''}
      <form class="form" id="reg" novalidate>
        <label class="f">Full name<input name="name" required autocomplete="name"></label>
        <label class="f">Email<input name="email" type="email" required autocomplete="email"></label>
        <div class="row"><label class="f">Phone<input name="phone" type="tel" autocomplete="tel"></label>
        <label class="f">School / organisation<input name="organisation"></label></div>
        <label class="f">Anything we should know? <span class="hint">Accessibility needs, questions</span><textarea name="notes" style="min-height:80px"></textarea></label>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label class="check"><input type="checkbox" name="consent" required><span>I agree that Superwings Foundation may use these details to manage my registration and email me about this event. They are deleted automatically 7 days after the event.</span></label>
        <button class="btn btn-primary" type="submit">Confirm registration</button>
      </form>`;
  }

  function render({ event: ev, agenda }) {
    if (registered) return;
    if (painted && dirty) { // someone is filling in the form: only refresh the seat count
      const seats = main.querySelector('.seats');
      if (seats && ev.seats_left != null) seats.textContent = `${ev.seats_left} seat${ev.seats_left === 1 ? '' : 's'} left`;
      return;
    }
    document.title = `${ev.title} | Superwings Foundation`;
    const venue = [ev.venue, ev.address].filter(Boolean).join(', ');
    main.innerHTML = `
      <div class="ev-hero">${ev.cover_id ? `<img class="bg" src="${SW.media(ev.cover_id, 1800)}" alt="" loading="eager" onload="this.classList.add('ld')">` : ''}
        <div class="wrap"><a href="/events/" style="color:#fff;opacity:.85;text-decoration:none;font-weight:700">← All events</a>
          <h1 style="margin-top:14px">${esc(ev.title)}</h1>${ev.subtitle ? `<p class="sub">${esc(ev.subtitle)}</p>` : ''}
          <div class="chips"><span class="chip y">${esc(SW.date(ev.start_at))}</span><span class="chip">${esc(SW.time(ev.start_at))} – ${esc(SW.time(ev.end_at))} IST</span>${ev.venue ? `<span class="chip">${esc(ev.venue)}</span>` : ''}</div>
        </div></div>
      <section style="padding-top:64px"><div class="wrap layout">
        <div>
          ${ev.description ? `<span class="eyebrow">About this event</span><div class="desc">${SW.paras(ev.description)}</div>` : ''}
          ${agenda.length ? `<div id="agenda" style="margin-top:40px"><span class="eyebrow">Agenda</span><h2 style="font-size:2rem;margin-bottom:24px">How the day runs</h2><div class="agenda">
            ${agenda.map((a) => `<div class="ag"><div class="t">${esc(a.start_time || '')}${a.end_time ? `<small>to ${esc(a.end_time)}</small>` : ''}</div>
              <div class="b"><h4>${esc(a.title)}</h4>${a.speaker ? `<div class="sp">${esc(a.speaker)}</div>` : ''}${a.description ? `<p>${esc(a.description)}</p>` : ''}</div></div>`).join('')}
          </div></div>` : ''}
        </div>
        <aside class="card reg-card">
          <div id="reg-box">${regForm(ev)}</div>
          <div class="info">
            <div><b>◷</b><span>${esc(SW.when(ev.start_at, ev.end_at))} IST</span></div>
            ${venue ? `<div><b>⌂</b><span>${esc(venue)}${ev.map_url ? `<br><a href="${esc(ev.map_url)}" target="_blank" rel="noopener" style="color:var(--green);font-weight:700">Open in Maps →</a>` : ''}</span></div>` : ''}
          </div>
          <div class="actions"><button class="btn btn-ghost" id="cal">Add to calendar</button><button class="btn btn-ghost" id="share">Share</button></div>
        </aside>
      </div></section>`;
    if (!painted) main.classList.add('fade-in');
    painted = true;
    document.getElementById('cal').onclick = () => ics(ev);
    document.getElementById('share').onclick = async () => {
      if (navigator.share) { try { await navigator.share({ title: ev.title, url: location.href }); } catch {} }
      else { try { await navigator.clipboard.writeText(location.href); document.getElementById('share').textContent = 'Link copied'; } catch {} }
    };
    const form = document.getElementById('reg');
    if (form) {
      form.addEventListener('input', () => (dirty = true), { once: true });
      SW.bindForm(form, async (data) => {
        const r = await SW.api(`/api/events/${encodeURIComponent(ev.slug)}/register`, { body: data });
        registered = true;
        SW.store.del('swc:/api/events/' + ev.slug);
        document.getElementById('reg-box').innerHTML = `<div class="success fade-in" style="padding:10px 0 0"><div class="tick">✓</div><h3>You're registered!</h3>
          <p class="muted">Your registration code is</p><div class="code">${esc(r.code)}</div>
          <p class="muted" style="font-size:.92rem">We have emailed a confirmation to <strong>${esc(data.email)}</strong> and will send a reminder before the event.</p></div>`;
      });
    }
  }

  function notFound() {
    document.title = 'Page not found | Superwings Foundation';
    main.innerHTML = `<div class="page-hero fade-in" style="min-height:55vh"><div class="wrap"><span class="eyebrow">404</span><h1>${slug ? 'We could not find this event.' : 'This page flew away.'}</h1>
      <p>${slug ? 'It may have been renamed or removed.' : 'The page you are looking for does not exist or has moved.'}</p>
      <div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap"><a class="btn btn-primary" href="/events/">See all events</a><a class="btn btn-ghost" href="/">Go home</a></div></div></div>`;
  }

  if (!slug) notFound();
  else {
    if (window.__EVENT__ && window.__EVENT__.event.slug === slug) render(window.__EVENT__); // pre-rendered at build time
    if (!painted) main.innerHTML = `<div class="ev-hero"><div class="wrap"><div class="sk sk-line" style="width:120px;opacity:.4"></div><div class="sk sk-line" style="height:54px;width:60%;opacity:.4"></div><div class="sk sk-line" style="width:40%;opacity:.4"></div></div></div>
      <section><div class="wrap layout"><div><div class="sk sk-block"></div></div><div class="sk sk-block" style="height:420px"></div></div></section>`;
    const load = () => SW.live('/api/events/' + encodeURIComponent(slug), render, (e) => {
      if (painted) return;
      if (e.status === 404) notFound(); else SW.gentle(main.querySelector('.layout') || main, load, 'We are having trouble loading this event.');
    });
    load();
  }
</script>
</body>
</html>
