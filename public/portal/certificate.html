<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Volunteer Hours Statement | Superwings Foundation</title>
<link rel="icon" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  body{background:#e9eee7}
  .tools{width:min(860px,94%);margin:24px auto 0;display:flex;gap:10px;justify-content:flex-end}
  .sheet{width:min(860px,94%);margin:16px auto 40px;background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.12);position:relative;overflow:hidden}
  .sheet::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:linear-gradient(90deg,var(--green) 0 70%,var(--yellow) 70%)}
  .in{padding:52px 56px 44px}
  .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid var(--line);padding-bottom:20px}
  .hd img{height:70px}
  .hd .org{text-align:right;font-size:.82rem;color:var(--muted);line-height:1.5}
  .hd .org strong{color:var(--green-deep);font-size:1rem}
  h1{font-size:2.1rem;margin:28px 0 4px}
  .lead{color:var(--muted)}
  .summary{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin:24px 0;background:#f7faf5;border-radius:16px;padding:22px}
  .summary dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:.94rem}
  .summary dt{color:var(--muted)}
  .summary dd{font-weight:700}
  .total{text-align:center;align-self:center}
  .total b{font-family:"Baloo 2";font-size:3.4rem;color:var(--green-deep);line-height:1;display:block}
  table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}
  th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:2px solid var(--line);padding:8px}
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  td small{color:var(--muted)}
  .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:56px}
  .sig div{border-top:1.5px solid var(--ink);padding-top:8px;font-size:.88rem}
  .sig strong{display:block;font-size:.95rem}
  .foot{margin-top:30px;font-size:.76rem;color:var(--muted);text-align:center}
  @media print{body{background:#fff}.tools{display:none}.sheet{box-shadow:none;margin:0;width:100%;border-radius:0}.in{padding:28px 10px}}
</style>
</head>
<body>
<div class="tools"><a class="btn btn-ghost" href="/portal/">← Portal</a><button class="btn btn-primary" onclick="print()">Print / save as PDF</button></div>
<div class="sheet"><div class="in" id="doc">Loading…</div></div>
<script src="/assets/config.js"></script>
<script src="/assets/site.js"></script>
<script>
  (async () => {
    const { esc } = SW;
    const uid = new URLSearchParams(location.search).get('u');
    try {
      const r = await SW.api('/api/certificate/' + encodeURIComponent(uid));
      const p = r.profile, s = r.settings, acts = r.activities.slice().sort((a, b) => a.date.localeCompare(b.date));
      const total = acts.reduce((t, a) => t + Number(a.hours), 0);
      const strands = { creativity: 'C', activity: 'A', service: 'S' };
      const cas = p.programme === 'ibdp_cas';
      const range = acts.length ? `${SW.fmt(acts[0].date + 'T12:00:00+05:30', { dateStyle: 'medium' })} – ${SW.fmt(acts.at(-1).date + 'T12:00:00+05:30', { dateStyle: 'medium' })}` : '—';
      document.title = `Hours statement: ${p.name}`;
      document.getElementById('doc').innerHTML = `
        <div class="hd"><img src="/assets/logo.jpg" alt="Superwings Foundation"><div class="org"><strong>${esc(s.org_name)}</strong><br>Public Charitable Trust · Reg. No. ${esc(s.reg_no)}<br>${esc(s.address)}<br>${esc(s.contact_email)} · ${esc(s.contact_phone)}</div></div>
        <h1>Volunteer Hours Statement</h1>
        <p class="lead">This certifies that the volunteer named below completed the following service with ${esc(s.org_name)}. Every entry was verified by our coordinators.</p>
        <div class="summary"><dl>
          <dt>Volunteer</dt><dd>${esc(p.name)}</dd><dt>Programme</dt><dd>${esc(p.programme_label)}</dd>
          <dt>Institution</dt><dd>${esc(p.partner_name || p.institution || '—')}${p.grade ? `, ${esc(p.grade)}` : ''}</dd>
          <dt>Period</dt><dd>${esc(range)}</dd><dt>Issued</dt><dd>${esc(r.issued)}</dd></dl>
          <div class="total"><b>${Number(total.toFixed(2))}</b>verified hours</div></div>
        ${acts.length ? `<table><thead><tr><th>Date</th><th>Activity</th>${cas ? '<th>Strands</th><th>Outcomes</th>' : ''}<th style="text-align:right">Hours</th></tr></thead><tbody>
          ${acts.map((a) => `<tr><td style="white-space:nowrap">${esc(SW.fmt(a.date + 'T12:00:00+05:30', { dateStyle: 'medium' }))}</td><td><strong>${esc(a.title)}</strong>${a.description ? `<br><small>${esc(a.description)}</small>` : ''}</td>
            ${cas ? `<td>${esc((a.strands || '').split(',').filter(Boolean).map((x) => strands[x]).join(', '))}</td><td>${esc((a.outcomes || '').replace(/,/g, ', '))}</td>` : ''}<td style="text-align:right">${a.hours}</td></tr>`).join('')}
          </tbody></table>` : '<p class="muted">No verified activities yet.</p>'}
        ${cas ? '<p class="muted" style="font-size:.78rem;margin-top:10px">C = Creativity · A = Activity · S = Service. Learning outcomes (LO1–LO7) as tagged by the student and verified by our coordinators.</p>' : ''}
        <div class="sig">${(r.signatories.length ? r.signatories : [{ name: '', title: 'Volunteer Programme Coordinator' }, { name: '', title: 'Trustee' }]).slice(0, 2)
          .map((x) => `<div><strong>${esc(x.name || ' ')}</strong>${esc(x.title || '')}<br>${esc(s.org_name)}</div>`).join('')}</div>
        <p class="foot">Statement generated from the ${esc(s.org_name)} volunteer portal on ${esc(r.issued)}. To verify it, contact ${esc(s.contact_email)}.</p>`;
    } catch (e) { document.getElementById('doc').innerHTML = `<p>${esc(e.message)}. <a href="/portal/">Sign in</a> to view your statement.</p>`; }
  })();
</script>
</body>
</html>
