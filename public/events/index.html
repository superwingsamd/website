<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events | Superwings Foundation</title>
<meta name="description" content="Upcoming and past events by Superwings Foundation, Ahmedabad.">
<link rel="icon" href="/assets/logo.jpg">
<link rel="canonical" href="https://superwingsfoundation.org/events/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main>
  <div class="page-hero"><div class="wrap">
    <span class="eyebrow">Events</span>
    <h1>Camps, drives and gatherings.</h1>
    <p>Join a literacy drive, a health camp or a community gathering. Each event has its own page with the full agenda and a short registration form.</p>
  </div></div>
  <section style="padding-top:56px">
    <div class="wrap">
      <div class="tabs" role="tablist"><button class="on" data-past="0">Upcoming</button><button data-past="1">Past</button></div>
      <div class="grid-3" id="list"></div>
    </div>
  </section>
</main>
<script src="/assets/config.js"></script>
<script src="/assets/site.js"></script>
<script>
  SW.chrome('Events');
  const list = document.getElementById('list');
  let current = 0;
  function load(past) {
    const mine = ++current;
    list.innerHTML = SW.skeleton(3);
    const render = ({ events }) => {
      if (mine !== current) return;
      list.innerHTML = events.length ? events.map(SW.eventCard).join('')
        : `<div class="empty fade-in" style="grid-column:1/-1">${past ? 'No past events yet.' : 'No upcoming events right now. Check back soon, or <a href="/volunteer">join our volunteer programme</a> to hear first.'}</div>`;
    };
    SW.live('/api/events' + (past ? '?past=1' : ''), render, () => mine === current && SW.gentle(list, () => load(past)));
  }
  document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    load(b.dataset.past === '1');
  });
  load(false);
</script>
</body>
</html>
